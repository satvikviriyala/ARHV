[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend", "docs/reference", ".aws-sam", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S105", "S106", "B017"]
"scripts/*" = ["S603", "S607", "S310"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
